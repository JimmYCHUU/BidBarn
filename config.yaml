# Nichibo bidding assistant configuration

# TESTING LOCK. Bids are never submitted while this is anything other than the exact
# phrase "The project is finished". Only Jim changes it, after he has said those words.
project_status: testing

# Safety: while true, `bot place` does everything except the final click.
dry_run: true

# Judgement. "none" = you judge the sheet and photos on the review page yourself.
# "judge" = a free hosted vision model (below) reads the photos against the guide's requirements
# and your playbook, flags odd cases and proposes an amount; you confirm on the review page.
# "openai" = the opt-in paid path with OPENAI_API_KEY (kept for comparison).
sheet_check: judge
model: gpt-5
model_reasoning_effort: medium
max_photos_to_model: 12

# Free providers, tried in order (the next one takes over when a quota is used up or a call
# fails). Keys live in .env: GEMINI_API_KEY (Google AI Studio), GROQ_API_KEY (Groq console).
# Model names checked on 2026-09-28 against each provider's model list; rpm/rpd are the free-tier
# limits to respect (check your consoles, they change). Groq has no vision model on the free
# tier today, so it is text only: used for lots that need no photos. The bot never sends the bid
# grid: only the lot's facts, the guide's text requirements, your comments, the candidate
# amounts, the sheet and the photos.
judge:
  enabled: true
  inline: true          # judge during the scan; `bot judge --pending` catches up when false or when a quota ran out
  max_photos: 8
  providers:
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.5-flash-lite
      api_key_env: GEMINI_API_KEY
      rpm: 10
      rpd: 400
      vision: true
    - name: gemini-3.1
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.1-flash-lite
      api_key_env: GEMINI_API_KEY
      rpm: 10
      rpd: 400
      vision: true
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
      rpm: 20
      rpd: 800
      vision: false

# Import eligibility (Jim, 2026-09-30): every lot is checked against the MRE/SEV pair behind its guide.
# It never skips a lot; a failing lot stays in review with "cannot import" and the reason.
eligibility:
  enabled: true
  judge_text: true     # the free model reads the pair's restriction text as a pre-fill
  stale_days: 90       # a ROVER copy older than this is flagged on the lot

# Refuse to propose or place when the rules snapshot is older than this.
max_rules_age_hours: 12

# Hard cap on bids placed in one `bot place` run.
max_bids_per_run: 25

# Downloaded Nichibo pages, translator replies and images are reused for this many hours
# (bot scan --fresh ignores the cache). Rule changes never need a re-download: bot replay --apply.
cache_hours: 12

# Card-level pre-filter opens detail pages only for cards that could possibly bid.
open_details_only_for_candidates: true

# Pacing between Nichibo page loads (seconds, uniform random).
pace_seconds: [1.5, 4.0]

# Where the persistent Chrome profile lives (logged in to Nichibo and Carbarn).
profile_dir: data/profile
db_path: data/bot.sqlite
evidence_dir: data/evidence
snapshot_dir: rules/snapshots
override_dir: rules/overrides

carbarn:
  dashboard_url: https://dashboard.carbarn.com.au/?view=bidding
  api_base: https://www.cbs.s1.carbarn.com.au
  # Team Bid = guides with bossBid == false
  boss_bid: false

nichibo:
  base_url: https://autosearch.nichibojapan.com
  # Search always uses the widest year/odo range implied by the bid grid.
  per_page: 1000

review:
  host: 127.0.0.1
  port: 8765
